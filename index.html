const GROQ_MODEL = 'llama-3.3-70b-versatile';
let GROQ_KEY = localStorage.getItem('groq_key') || '';

function getOrAskGroqKey() {
  const saved = localStorage.getItem('groq_key');
  if (saved) { GROQ_KEY = saved; return true; }
  return false;
}

function showKeyModal() {
  document.getElementById('key-modal').removeAttribute('hidden');
}

function saveKey() {
  const val = document.getElementById('key-input').value.trim();
  if (!val.startsWith('gsk_')) {
    document.getElementById('key-error').textContent = 'La key debe empezar con gsk_';
    return;
  }
  GROQ_KEY = val;
  localStorage.setItem('groq_key', val);
  document.getElementById('key-modal').setAttribute('hidden', '');
  document.getElementById('key-error').textContent = '';
  updateKeyBtn();
}

function clearKey() {
  GROQ_KEY = '';
  localStorage.removeItem('groq_key');
  updateKeyBtn();
  showKeyModal();
}

function updateKeyBtn() {
  const btn = document.getElementById('config-key-btn');
  if (GROQ_KEY) {
    btn.textContent = '🔑 Key activa';
    btn.style.color = 'var(--fg-2)';
  } else {
    btn.textContent = '⚠️ Configurar key';
    btn.style.color = '#C0392B';
  }
}

async function callGroq(systemPrompt, history, userMsg) {
  const messages = [
    { role: 'system', content: systemPrompt },
    ...history,
    { role: 'user', content: userMsg }
  ];
  const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + GROQ_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ model: GROQ_MODEL, messages, temperature: 0.85, max_tokens: 1200 })
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error('Groq ' + resp.status + ': ' + err);
  }
  const data = await resp.json();
  const text = data.choices[0].message.content.trim();
  // Extraer JSON aunque venga con markdown
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error('Respuesta no es JSON válido');
  return JSON.parse(jsonMatch[0]);
}

// Estado por persona
const states = PERSONAS.map(() => ({ turns: [], history: [] }));

function loadAll() {
  PERSONAS.forEach((p, i) => {
    try {
      const saved = localStorage.getItem(STORAGE_PREFIX + p.id);
      if (saved) states[i] = JSON.parse(saved);
    } catch(e) {}
  });
}

function saveState(i) {
  try { localStorage.setItem(STORAGE_PREFIX + PERSONAS[i].id, JSON.stringify(states[i])); } catch(e) {}
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setPersonaTokens(p) {
  const root = document.documentElement;
  root.style.setProperty('--p-accent', p.accent);
  root.style.setProperty('--p-accent-dark', p.accentDark);
  root.style.setProperty('--p-accent-bg', p.accentBg);
  root.style.setProperty('--p-accent-bg-dark', p.accentBgDark);
}

function buildTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = PERSONAS.map((p, i) =>
    `<button class="tab${i===0?' active':''}" data-i="${i}">
      <span class="tab-name">${p.name.split(' ')[0]}</span>
      <span class="tab-sub">${p.age} años</span>
    </button>`
  ).join('');
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    switchTab(parseInt(btn.dataset.i));
  });
}

function buildPanels() {
  const wrap = document.getElementById('chatWrap');
  wrap.innerHTML = PERSONAS.map((p, i) => `
    <div class="panel${i===0?' active':''}" id="panel-${p.id}">
      <div class="badge-bar">
        ${p.badges.map(b => `<span class="badge">${esc(b)}</span>`).join('')}
      </div>
      <div class="chat" id="chat-${p.id}"></div>
      <div class="input-area">
        <div class="input-row">
          <textarea id="input-${p.id}" placeholder="Pregunta para ${p.name.split(' ')[0]}…" rows="1"></textarea>
          <button class="send-btn" id="btn-${p.id}">Enviar</button>
        </div>
        <div class="status-row">
          <span class="status" id="status-${p.id}"></span>
          <div style="display:flex;gap:6px">
            <button class="reset-btn" id="export-${p.id}">↓ Exportar PDF</button>
            <button class="reset-btn" id="reset-${p.id}">↺ Reiniciar</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  PERSONAS.forEach((p, i) => {
    const ta = document.getElementById('input-' + p.id);
    const btn = document.getElementById('btn-' + p.id);
    const rst = document.getElementById('reset-' + p.id);
    const exp = document.getElementById('export-' + p.id);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(i); }
    });
    ta.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 130) + 'px';
    });
    btn.addEventListener('click', () => sendQuestion(i));
    rst.addEventListener('click', () => {
      states[i] = { turns: [], history: [] };
      saveState(i);
      renderChat(i);
    });
    exp.addEventListener('click', () => exportPDF(i));
    renderChat(i);
  });
}

function switchTab(i) {
  activeIdx = i;
  // tabs
  document.querySelectorAll('.tab').forEach((t, j) => {
    t.classList.toggle('active', j === i);
  });
  // panels
  document.querySelectorAll('.panel').forEach((panel, j) => {
    panel.classList.toggle('active', j === i);
  });
  // tokens
  setPersonaTokens(PERSONAS[i]);
}

function renderChat(i) {
  const p = PERSONAS[i];
  const container = document.getElementById('chat-' + p.id);
  const state = states[i];
  if (!state.turns.length) {
    container.innerHTML = `<div class="empty">
      <div class="empty-icon">${esc(p.icon)}</div>
      <h3>${esc(p.name.split(' ')[0])}</h3>
      <p>${esc(p.role)}</p>
    </div>`;
    return;
  }
  container.innerHTML = state.turns.map(t => {
    if (t.role === 'q') {
      return `<div class="turn"><div class="q-bubble">${esc(t.content)}</div></div>`;
    }
    const nv = t.nv;
    return `<div class="turn">
      <div class="a-wrap">
        <span class="a-label">${esc(p.name)}</span>
        <div class="a-bubble">${esc(t.verbal)}</div>
        <div class="nv-box">
          <div class="nv-title">No verbal</div>
          <div class="nv-grid">
            <div class="nv-item"><span class="nv-k">Postura</span><span class="nv-v">${esc(nv.postura||'')}</span></div>
            <div class="nv-item"><span class="nv-k">Expresión</span><span class="nv-v">${esc(nv.expresion||'')}</span></div>
            <div class="nv-item"><span class="nv-k">Mirada</span><span class="nv-v">${esc(nv.mirada||'')}</span></div>
            <div class="nv-item"><span class="nv-k">Voz</span><span class="nv-v">${esc(nv.voz||'')}</span></div>
            <div class="nv-item nv-full"><span class="nv-k">Emoción</span><span class="nv-v">${esc(nv.emocion||'')}</span></div>
            ${nv.otros?`<div class="nv-item nv-full"><span class="nv-k">Otros</span><span class="nv-v">${esc(nv.otros)}</span></div>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  requestAnimationFrame(() => {
    container.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'end' });
  });
}

async function sendQuestion(i) {
  if (busy) return;
  const p = PERSONAS[i];
  const ta = document.getElementById('input-' + p.id);
  const btn = document.getElementById('btn-' + p.id);
  const statusEl = document.getElementById('status-' + p.id);
  const q = ta.value.trim();
  if (!q) return;

  if (!GROQ_KEY) {
    showKeyModal();
    return;
  }

  busy = true;
  ta.value = '';
  ta.style.height = 'auto';
  btn.disabled = true;
  statusEl.textContent = p.name.split(' ')[0] + ' está pensando…';

  const state = states[i];
  state.turns.push({ role: 'q', content: q });
  renderChat(i);
  saveState(i);

  try {
    const result = await callGroq(p.persona, state.history, q);
    state.history = [...state.history,
      { role: 'user', content: q },
      { role: 'assistant', content: JSON.stringify(result) }
    ];
    state.turns.push({ role: 'a', verbal: result.verbal, nv: result.noVerbal });
    saveState(i);
    renderChat(i);
    statusEl.textContent = '';
  } catch(e) {
    state.turns.pop();
    saveState(i);
    renderChat(i);
    statusEl.textContent = 'Error al generar. Intentá de nuevo.';
    console.error(e);
  }
  busy = false;
  btn.disabled = false;
}

// ── EXPORT PDF ────────────────────────────────────────────────────────────────
async function exportPDF(i) {
  const p = PERSONAS[i];
  const state = states[i];
  const statusEl = document.getElementById('status-' + p.id);
  const btn = document.getElementById('export-' + p.id);

  if (!state.turns.length) {
    statusEl.textContent = 'No hay conversación para exportar.';
    setTimeout(() => { statusEl.textContent = ''; }, 2500);
    return;
  }

  btn.disabled = true;
  statusEl.textContent = 'Generando PDF…';

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = 210;
    const margin = 18;
    const contentW = pageW - margin * 2;
    let y = margin;

    // Helpers
    function checkPage(needed = 8) {
      if (y + needed > 280) { doc.addPage(); y = margin; }
    }
    function wrapText(text, maxW, size) {
      doc.setFontSize(size);
      return doc.splitTextToSize(String(text), maxW);
    }

    // ── Encabezado ──
    doc.setFillColor(245, 243, 241);
    doc.rect(0, 0, 210, 32, 'F');
    doc.setFontSize(18);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(26, 25, 23);
    doc.text('Simulador BE Dermatología', margin, y + 8);
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(90, 88, 85);
    doc.text(`${p.name}  ·  ${p.role}`, margin, y + 16);
    doc.setFontSize(8);
    doc.text(`Exportado el ${new Date().toLocaleDateString('es-CO', {day:'2-digit',month:'long',year:'numeric'})}`, margin, y + 22);
    y += 38;

    // Badges
    doc.setFontSize(7.5);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(80, 80, 80);
    const badgeText = p.badges.join('  ·  ');
    const badgeLines = wrapText(badgeText, contentW, 7.5);
    doc.text(badgeLines, margin, y);
    y += badgeLines.length * 4 + 6;

    // Línea separadora
    doc.setDrawColor(221, 219, 216);
    doc.line(margin, y, pageW - margin, y);
    y += 8;

    // ── Conversación ──
    state.turns.forEach((t, idx) => {
      if (t.role === 'q') {
        checkPage(14);
        // Burbuja pregunta
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.setTextColor(90, 88, 85);
        doc.text('INVESTIGADOR', margin, y);
        y += 4;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(26, 25, 23);
        const qLines = wrapText(t.content, contentW - 10, 10);
        const qH = qLines.length * 5 + 6;
        checkPage(qH + 4);
        doc.setFillColor(235, 235, 233);
        doc.roundedRect(margin, y, contentW, qH, 2, 2, 'F');
        doc.text(qLines, margin + 4, y + 5);
        y += qH + 6;
      } else {
        checkPage(20);
        // Nombre persona
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.setTextColor(90, 88, 85);
        doc.text(p.name.toUpperCase(), margin, y);
        y += 4;
        // Respuesta verbal
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(26, 25, 23);
        const aLines = wrapText(t.verbal, contentW - 10, 10);
        const aH = aLines.length * 5 + 6;
        checkPage(aH + 4);
        // Color del acento en hex→rgb
        const hex = p.accent.replace('#','');
        const r = parseInt(hex.substring(0,2),16);
        const g = parseInt(hex.substring(2,4),16);
        const b = parseInt(hex.substring(4,6),16);
        doc.setFillColor(r, g, b, 0.08);
        doc.setFillColor(250, 248, 245);
        doc.roundedRect(margin, y, contentW, aH, 2, 2, 'F');
        doc.setDrawColor(r, g, b);
        doc.setLineWidth(0.6);
        doc.line(margin, y, margin, y + aH);
        doc.setLineWidth(0.2);
        doc.text(aLines, margin + 5, y + 5);
        y += aH + 4;

        // No verbal
        const nv = t.nv || {};
        const nvItems = [
          ['Postura', nv.postura], ['Expresión', nv.expresion],
          ['Mirada', nv.mirada], ['Voz', nv.voz],
          ['Emoción', nv.emocion], ['Otros', nv.otros]
        ].filter(([,v]) => v);
        if (nvItems.length) {
          checkPage(10);
          doc.setFillColor(248, 248, 247);
          const nvStartY = y;
          let nvY = y + 4;
          nvItems.forEach(([k, v]) => {
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7.5);
            doc.setTextColor(120, 118, 115);
            doc.text(k.toUpperCase() + ':', margin + 4, nvY);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(60, 58, 55);
            const vLines = wrapText(v, contentW - 40, 7.5);
            doc.text(vLines, margin + 24, nvY);
            nvY += Math.max(vLines.length * 3.5, 4) + 1;
          });
          const nvH = nvY - nvStartY + 3;
          doc.setFillColor(248, 248, 247);
          doc.rect(margin, nvStartY, contentW, nvH, 'F');
          // Redibujar texto encima del rect
          nvY = nvStartY + 4;
          nvItems.forEach(([k, v]) => {
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7.5);
            doc.setTextColor(120, 118, 115);
            doc.text(k.toUpperCase() + ':', margin + 4, nvY);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(60, 58, 55);
            const vLines = wrapText(v, contentW - 40, 7.5);
            doc.text(vLines, margin + 24, nvY);
            nvY += Math.max(vLines.length * 3.5, 4) + 1;
          });
          y = nvY + 4;
        }
        y += 4;
      }
    });

    // Footer
    const totalPages = doc.internal.getNumberOfPages();
    for (let pg = 1; pg <= totalPages; pg++) {
      doc.setPage(pg);
      doc.setFontSize(7);
      doc.setTextColor(160, 158, 155);
      doc.text(`BE Dermatología · Investigación de Diseño · ${p.name}`, margin, 291);
      doc.text(`${pg} / ${totalPages}`, pageW - margin, 291, { align: 'right' });
    }

    // Generar blob y descargar (descarga nativa — funciona fuera de Claude)
    const blob = doc.output('blob');
    const filename = `BE_${p.name.replace(/ /g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    statusEl.textContent = '';
  } catch(e) {
    console.error(e);
    statusEl.textContent = 'Error al exportar. Intentá de nuevo.';
  }
  btn.disabled = false;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadAll();
buildTabs();
buildPanels();
setPersonaTokens(PERSONAS[0]);
// Key setup
if (!GROQ_KEY) {
  showKeyModal();
} else {
  document.getElementById('key-modal').setAttribute('hidden', '');
}
updateKeyBtn();
</script>
